name: PC Virtual Windows - Tailscale RDP

on:
  workflow_dispatch:

jobs:
  pc-windows:

    runs-on: windows-latest

    timeout-minutes: 350

    steps:

      - name: Preparar Windows
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "       PREPARANDO PC WINDOWS"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "Windows:"
          Get-ComputerInfo |
            Select-Object WindowsProductName, WindowsVersion, OsArchitecture

          Write-Host ""
          Write-Host "CPU:"
          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfCores, NumberOfLogicalProcessors

          Write-Host ""
          Write-Host "RAM:"
          $ram = Get-CimInstance Win32_ComputerSystem
          Write-Host "$([math]::Round($ram.TotalPhysicalMemory / 1GB, 2)) GB"

      - name: Criar usuario RDP
        shell: powershell
        run: |
          $username = "virtualpc"
          $password = "123456"

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $user = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($null -eq $user) {
            New-LocalUser `
              -Name $username `
              -Password $securePassword `
              -FullName "Virtual PC" `
              -Description "Usuario RDP"
          }
          else {
            Set-LocalUser `
              -Name $username `
              -Password $securePassword
          }

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Write-Host "Usuario RDP configurado."

      - name: Ativar RDP
        shell: powershell
        run: |

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          Set-Service `
            -Name TermService `
            -StartupType Automatic

          Restart-Service TermService

          Start-Sleep -Seconds 5

          Write-Host "RDP ativado."

      - name: Instalar Tailscale
        shell: powershell
        run: |

          $installer = "$env:TEMP\tailscale-setup.exe"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" `
            -OutFile $installer

          Start-Process `
            -FilePath $installer `
            -ArgumentList "/quiet" `
            -Wait

          Start-Sleep -Seconds 10

          Write-Host "Tailscale instalado."

      - name: Conectar Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}

        run: |

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
            Write-Host "ERRO: TAILSCALE_AUTHKEY não encontrado."
            exit 1
          }

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (!(Test-Path $tailscale)) {
            Write-Host "ERRO: Tailscale não encontrado."
            exit 1
          }

          & $tailscale up `
            --auth-key="$env:TAILSCALE_AUTHKEY" `
            --hostname="github-pc-windows"

          Start-Sleep -Seconds 10

          Write-Host ""
          Write-Host "Tailscale conectado."

      - name: Verificar Tailscale
        shell: powershell
        run: |

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "          TAILSCALE"
          Write-Host "=========================================="

          Write-Host ""
          Write-Host "Status:"
          & $tailscale status

          Write-Host ""
          Write-Host "IP Tailscale:"

          $ip = (& $tailscale ip -4).Trim()

          if ([string]::IsNullOrWhiteSpace($ip)) {
            Write-Host "ERRO: IP Tailscale não encontrado."
            exit 1
          }

          Write-Host $ip

      - name: Verificar RDP
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "              TESTE RDP"
          Write-Host "=========================================="

          $service = Get-Service TermService

          Write-Host ""
          Write-Host "Serviço:"
          Write-Host $service.Status

          if ($service.Status -ne "Running") {
            Start-Service TermService
          }

          Start-Sleep -Seconds 3

          $port = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if ($null -eq $port) {
            Write-Host ""
            Write-Host "ERRO: RDP não está escutando na porta 3389."
            exit 1
          }

          Write-Host ""
          Write-Host "RDP OK!"
          Write-Host "Porta 3389 está aberta."

      - name: Detectar GPU
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "                GPU"
          Write-Host "=========================================="

          $gpus = Get-CimInstance Win32_VideoController

          foreach ($gpu in $gpus) {

            Write-Host ""
            Write-Host "GPU:"
            Write-Host $gpu.Name

            Write-Host "Processador:"
            Write-Host $gpu.VideoProcessor

            if ($gpu.AdapterRAM) {
              Write-Host "VRAM:"
              Write-Host "$([math]::Round($gpu.AdapterRAM / 1GB, 2)) GB"
            }
          }

          Write-Host ""
          Write-Host "NVIDIA SMI:"

          $nvidia = Get-Command nvidia-smi `
            -ErrorAction SilentlyContinue

          if ($null -ne $nvidia) {
            nvidia-smi
          }
          else {
            Write-Host "nvidia-smi não disponível neste runner."
          }

      - name: Mostrar PC para Windows App
        shell: powershell
        run: |

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          $ip = (& $tailscale ip -4).Trim()

          Write-Host ""
          Write-Host "================================================"
          Write-Host "             PC WINDOWS ONLINE"
          Write-Host "================================================"
          Write-Host ""
          Write-Host "WINDOWS APP"
          Write-Host ""
          Write-Host "PC NAME:"
          Write-Host $ip
          Write-Host ""
          Write-Host "USUARIO:"
          Write-Host "virtualpc"
          Write-Host ""
          Write-Host "SENHA:"
          Write-Host "123456"
          Write-Host ""
          Write-Host "PORTA:"
          Write-Host "3389"
          Write-Host ""
          Write-Host "GATEWAY:"
          Write-Host "VAZIO"
          Write-Host ""
          Write-Host "================================================"

      - name: Manter PC online
        shell: powershell
        run: |

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          Write-Host ""
          Write-Host "================================================"
          Write-Host "           PC VIRTUAL RODANDO"
          Write-Host "================================================"

          while ($true) {

            $ip = (& $tailscale ip -4).Trim()

            Write-Host ""
            Write-Host "----------------------------------------"
            Write-Host "PC ativo: $(Get-Date)"
            Write-Host "Tailscale: $ip"
            Write-Host "----------------------------------------"

            $rdp = Get-NetTCPConnection `
              -LocalPort 3389 `
              -State Listen `
              -ErrorAction SilentlyContinue

            if ($null -ne $rdp) {
              Write-Host "RDP: ONLINE"
            }
            else {
              Write-Host "RDP: OFFLINE"
            }

            Write-Host ""
            Write-Host "GPU:"

            if (Get-Command nvidia-smi `
                -ErrorAction SilentlyContinue) {
              nvidia-smi `
                --query-gpu=name,memory.total,memory.used,utilization.gpu `
                --format=csv,noheader
            }

            Start-Sleep -Seconds 60
          }            xfce4-goodies \
            xrdp \
            dbus-x11 \
            xterm \
            firefox \
            chromium \
            git \
            curl \
            wget \
            nano \
            htop \
            unzip \
            zip \
            p7zip-full \
            mesa-utils \
            pciutils \
            net-tools

      # =========================================================
      # USUARIO DO PC
      # =========================================================

      - name: Criar usuario
        run: |

          if ! id virtualpc >/dev/null 2>&1; then
            sudo useradd -m -s /bin/bash virtualpc
          fi

          echo "virtualpc:123456" | sudo chpasswd

          sudo usermod -aG sudo virtualpc

      # =========================================================
      # CONFIGURAR XFCE
      # =========================================================

      - name: Configurar XFCE
        run: |

          sudo bash -c 'cat > /home/virtualpc/.xsession <<EOF
          #!/bin/sh

          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR

          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_CONFIG_DIRS=/etc/xdg/xdg-xfce:/etc/xdg
          export LIBGL_ALWAYS_INDIRECT=0

          exec startxfce4
          EOF'

          sudo chmod +x /home/virtualpc/.xsession

          sudo chown \
            virtualpc:virtualpc \
            /home/virtualpc/.xsession

      # =========================================================
      # CONFIGURAR XRDP
      # =========================================================

      - name: Configurar RDP
        run: |

          sudo bash -c 'cat > /etc/xrdp/startwm.sh <<EOF
          #!/bin/sh

          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR

          export XDG_CURRENT_DESKTOP=XFCE

          exec startxfce4
          EOF'

          sudo chmod +x /etc/xrdp/startwm.sh

          sudo adduser xrdp ssl-cert || true

          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

          sleep 5

      # =========================================================
      # VERIFICAR RDP
      # =========================================================

      - name: Verificar RDP
        run: |

          echo "=========================================="
          echo "        VERIFICANDO RDP"
          echo "=========================================="

          sudo systemctl status xrdp --no-pager || true

          echo ""

          sudo ss -lntp | grep 3389 || true

      # =========================================================
      # VERIFICAR GPU
      # =========================================================

      - name: Verificar GPU NVIDIA
        run: |

          echo "=========================================="
          echo "          GPU DISPONIVEL"
          echo "=========================================="

          if command -v nvidia-smi >/dev/null 2>&1; then

            nvidia-smi

          else

            echo "nvidia-smi nao encontrado."
            echo "Verificando hardware..."

            lspci | grep -i nvidia || true

          fi

      # =========================================================
      # VERIFICAR CPU / RAM / SSD
      # =========================================================

      - name: Mostrar hardware
        run: |

          echo "=========================================="
          echo "              HARDWARE"
          echo "=========================================="

          echo ""
          echo "CPU:"
          nproc

          echo ""
          echo "RAM:"
          free -h

          echo ""
          echo "SSD:"
          df -h /

          echo ""
          echo "GPU:"
          nvidia-smi || true

      # =========================================================
      # INSTALAR TAILSCALE
      # =========================================================

      - name: Instalar Tailscale
        run: |

          curl -fsSL https://tailscale.com/install.sh | sh

      # =========================================================
      # CONECTAR VPN
      # =========================================================

      - name: Conectar Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}

        run: |

          if [ -z "$TAILSCALE_AUTHKEY" ]; then

            echo "ERRO!"
            echo "Configure o secret TAILSCALE_AUTHKEY no GitHub."

            exit 1

          fi

          sudo tailscale up \
            --auth-key="$TAILSCALE_AUTHKEY" \
            --hostname=github-pc-gpu

          sleep 10

      # =========================================================
      # MOSTRAR IP PARA WINDOWS APP
      # =========================================================

      - name: Mostrar endereco do PC
        run: |

          IP=$(sudo tailscale ip -4)

          echo ""
          echo "================================================"
          echo "              PC VIRTUAL ONLINE"
          echo "================================================"
          echo ""

          echo "IP TAILSCALE:"
          echo "$IP"

          echo ""

          echo "WINDOWS APP"
          echo "PC NAME: $IP"
          echo "USUARIO: virtualpc"
          echo "SENHA: 123456"
          echo "GATEWAY: deixar vazio"

          echo ""

          echo "================================================"
          echo "              HARDWARE"
          echo "================================================"

          echo ""
          echo "CPU:"
          nproc

          echo ""
          echo "RAM:"
          free -h

          echo ""
          echo "SSD:"
          df -h /

          echo ""
          echo "GPU:"
          nvidia-smi || true

          echo ""
          echo "================================================"

      # =========================================================
      # TESTAR RDP
      # =========================================================

      - name: Testar porta RDP
        run: |

          echo "Testando porta 3389..."

          if sudo ss -lnt | grep -q ":3389"; then

            echo ""
            echo "RDP FUNCIONANDO!"
            echo "Porta 3389 aberta."

          else

            echo ""
            echo "ERRO: RDP NAO ESTA FUNCIONANDO."

            sudo systemctl status xrdp --no-pager

            exit 1

          fi

      # =========================================================
      # MANTER PC LIGADO
      # =========================================================

      - name: Manter PC online
        run: |

          echo ""
          echo "================================================"
          echo "           PC VIRTUAL RODANDO"
          echo "================================================"

          while true
          do

            echo ""
            echo "----------------------------------------"
            echo "PC ativo: $(date)"
            echo "----------------------------------------"

            echo "IP Tailscale:"
            sudo tailscale ip -4

            echo ""
            echo "RAM:"
            free -h

            echo ""
            echo "GPU:"
            nvidia-smi --query-gpu=name,memory.total,memory.used,utilization.gpu \
              --format=csv,noheader || true

            echo ""
            echo "RDP:"
            sudo ss -lnt | grep 3389 || true

            sleep 60

          done            zip

      - name: Criar usuario do PC
        run: |
          sudo useradd -m -s /bin/bash virtualpc || true

          echo "virtualpc:123456" | sudo chpasswd

          sudo usermod -aG sudo virtualpc

      - name: Configurar Desktop
        run: |
          sudo mkdir -p /home/virtualpc/.vnc

          sudo tee /home/virtualpc/.vnc/xstartup > /dev/null << 'EOF'
          #!/bin/sh

          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS

          exec startxfce4
          EOF

          sudo chmod +x /home/virtualpc/.vnc/xstartup

          echo "123456" | \
            sudo -u virtualpc \
            vncpasswd -f \
            > /tmp/vncpass

          sudo mv /tmp/vncpass /home/virtualpc/.vnc/passwd

          sudo chmod 600 /home/virtualpc/.vnc/passwd

          sudo chown -R virtualpc:virtualpc /home/virtualpc/.vnc

      - name: Iniciar PC Virtual
        run: |
          sudo -u virtualpc \
            vncserver :1 \
            -geometry 1280x720 \
            -depth 24

          sleep 10

          echo "VNC iniciado na porta 5901"

      - name: Iniciar acesso pelo navegador
        run: |
          nohup \
            websockify \
            --web /usr/share/novnc \
            6080 \
            localhost:5901 \
            > novnc.log 2>&1 &

          sleep 5

          echo "noVNC iniciado"

          curl -I http://localhost:6080/vnc.html

      - name: Instalar Cloudflared
        run: |
          wget -q \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -O cloudflared

          chmod +x cloudflared

          sudo mv cloudflared /usr/local/bin/cloudflared

      - name: Criar link publico do PC
        run: |
          nohup \
            cloudflared tunnel \
            --url http://localhost:6080 \
            --no-autoupdate \
            > cloudflared.log 2>&1 &

          echo "Aguardando criação do link..."

          sleep 15

          echo ""
          echo "=========================================="
          echo "            PC VIRTUAL ONLINE"
          echo "=========================================="
          echo ""

          cat cloudflared.log

          echo ""
          echo "Procure o link https://....trycloudflare.com"
          echo ""

      - name: Manter PC ligado
        run: |
          echo "=========================================="
          echo "PC VIRTUAL RODANDO"
          echo "=========================================="

          while true
          do
            echo "PC ativo: $(date)"

            sleep 60
          done
